# ============================================================================
# COMMIT 1: Web app + MySQL + phpMyAdmin + Nginx reverse proxy (HTTPS)
# Cac file docker-compose.monitoring.yml / docker-compose.logging.yml bo sung
# them dich vu o Commit 2 va Commit 3.
# ============================================================================
name: recipe-devops

services:
  db:
    image: mysql:8.0
    container_name: recipe_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?hay chay scripts/gen-env.ps1}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-recipes_db}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?}
      EXPORTER_DB_PASSWORD: ${EXPORTER_DB_PASSWORD:?}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --local-infile=0
      - --skip-name-resolve
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks: [db_net]               # mang noi bo, khong publish cong, khong ra Internet
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  app:
    build: ./app
    image: recipe-web:1.0
    container_name: recipe_app
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_NAME: ${MYSQL_DATABASE:-recipes_db}
      DB_USER: recipe_app
      DB_PASSWORD: ${APP_DB_PASSWORD:?}
    depends_on:
      db: { condition: service_healthy }
    networks: [web, db_net]
    # --- hardening ---
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 100

  nginx:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    container_name: recipe_nginx
    restart: unless-stopped
    ports:
      - "8080:8080"      # HTTP  -> redirect sang HTTPS
      - "8443:8443"      # HTTPS
    volumes:
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      app: { condition: service_healthy }
    networks: [web]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    pids_limit: 100

  phpmyadmin:
    image: phpmyadmin:5.2-apache
    container_name: recipe_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_ARBITRARY: "0"
    ports:
      - "127.0.0.1:8083:80"     # chi truy cap tu chinh may host
    depends_on:
      db: { condition: service_healthy }
    networks: [web, db_net]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m

networks:
  web:
    driver: bridge
  db_net:
    driver: bridge
    internal: true      # cach ly: khong co duong ra Internet

volumes:
  db_data:
