# Nginx reverse proxy cho ung dung Recipe
# Image: nginxinc/nginx-unprivileged (chay bang user khong phai root, cong 8080/8443)

log_format rcp '$remote_addr - $remote_user [$time_local] "$request" '
               '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

# Gioi han toc do: 10 request/giay/IP (chong brute-force, flood don gian)
limit_req_zone $binary_remote_addr zone=perip:10m rate=10r/s;
limit_req_status 429;

server_tokens off;   # an phien ban Nginx

# ---- HTTP: chuyen huong sang HTTPS ----------------------------------------
server {
    listen 8080;
    server_name _;
    access_log /dev/stdout rcp;
    return 301 https://$host:8443$request_uri;
}

# ---- HTTPS (chung chi tu ky) -----------------------------------------------
server {
    listen 8443 ssl;
    http2 on;
    server_name _;
    access_log /dev/stdout rcp;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:5m;
    ssl_session_timeout 10m;

    # Security headers co ban
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options           "DENY" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy   "default-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    client_max_body_size 64k;
    client_body_timeout  10s;
    client_header_timeout 10s;

    # /metrics chi danh cho Prometheus (noi bo), khong lo ra Internet
    location = /metrics { return 404; }

    location / {
        limit_req zone=perip burst=30 nodelay;
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}

# ---- Cong noi bo cho nginx-prometheus-exporter (khong publish ra host) -------
server {
    listen 8081;
    server_name _;
    access_log off;

    location = /nginx_status {
        stub_status;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
    }
}
