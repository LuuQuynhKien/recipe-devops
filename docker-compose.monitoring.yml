# ============================================================================
# COMMIT 2: Prometheus + Grafana + cAdvisor + nginx-exporter + mysqld-exporter
# Chay: docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d
# ============================================================================
services:
  # --- bo sung mang monitoring cho cac dich vu can duoc scrape ---
  app:
    networks: [monitoring]
  nginx:
    networks: [monitoring]

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: recipe_prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9091:9090"
    networks: [monitoring]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 512m

  grafana:
    image: grafana/grafana:11.4.0
    container_name: recipe_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?hay chay scripts/gen-env.ps1}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3001:3000"
    depends_on: [prometheus]
    networks: [monitoring]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 384m

  # Giam sat container (CPU, RAM, mang, disk)
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: recipe_cadvisor
    restart: unless-stopped
    command: ["--docker_only=true", "--housekeeping_interval=15s"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    # Neu tren Docker Desktop (Windows) cAdvisor khong hien ten container,
    # bo comment dong duoi (ngoai le co chu dich, xem muc Hardening trong bao cao):
    # privileged: true
    networks: [monitoring]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m

  # Giam sat web server Nginx (stub_status -> Prometheus)
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    container_name: recipe_nginx_exporter
    restart: unless-stopped
    command: ["--nginx.scrape-uri=http://nginx:8081/nginx_status"]
    depends_on: [nginx]
    networks: [monitoring]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 64m

  # Giam sat database MySQL
  mysqld-exporter:
    image: prom/mysqld-exporter:v0.16.0
    container_name: recipe_mysqld_exporter
    restart: unless-stopped
    command:
      - --mysqld.address=db:3306
      - --mysqld.username=exporter
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${EXPORTER_DB_PASSWORD:?}
    depends_on:
      db: { condition: service_healthy }
    networks: [db_net, monitoring]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 64m

networks:
  monitoring:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
