global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  # Container: CPU / RAM / network
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # Web server: Nginx stub_status
  - job_name: nginx
    static_configs:
      - targets: ["nginx-exporter:9113"]

  # Database: MySQL
  - job_name: mysql
    static_configs:
      - targets: ["mysqld-exporter:9104"]

  # Ung dung Node.js (http_requests_total, do tre, tai nguyen tien trinh)
  - job_name: recipe-app
    metrics_path: /metrics
    static_configs:
      - targets: ["app:3000"]
